<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Baseball Daily Weigh-In</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #171a1f;
      --muted: #6b7280;
      --border: #dfe3e8;
      --accent: #111827;
      --accent-soft: #eef0f3;
      --success-bg: #e8f3ec;
      --success-text: #245c38;
      --error-bg: #fbeaea;
      --error-text: #8a2d2d;
      --shadow: 0 14px 36px rgba(17, 24, 39, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    .app {
      width: min(100%, 440px);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 26px 22px;
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 12px;
    }

    .logo {
      width: 135px;
      max-width: 42%;
      height: auto;
      display: inline-block;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 27px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 8px 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    select,
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 14px;
      font-size: 17px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 3px rgba(156, 163, 175, 0.15);
    }

    input {
      font-size: 24px;
      font-weight: 700;
    }

    button {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 15px;
      padding: 16px;
      background: var(--accent);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 650;
      text-align: center;
      line-height: 1.4;
    }

    .status.show { display: block; }
    .status.success { background: var(--success-bg); color: var(--success-text); }
    .status.error { background: var(--error-bg); color: var(--error-text); }

    .helper {
      margin: 9px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>

      <h1>Baseball Daily Weigh-In</h1>
      <p class="subtitle">Select your name, enter today's weight, and submit once.</p>

      <label for="athlete">Athlete</label>
      <select id="athlete" disabled>
        <option value="">Loading roster...</option>
      </select>

      <label for="weight">Today's Weight</label>
      <input
        id="weight"
        type="number"
        inputmode="decimal"
        min="100"
        max="400"
        step="0.1"
        placeholder="0.0"
      />
      <div class="helper">Enter weight in pounds.</div>

      <button id="submitBtn" onclick="submitWeight()" disabled>Submit Weight</button>

      <div id="status" class="status"></div>

      <div class="footer">
        Daily weights are recorded directly into the team weight-tracking database.
      </div>
    </section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxWdWBWO_YiZZsvKrHQIP40k_is1kDIGaBL38-SbVhgRgcfPObTYW01rNnpJlOwlsVU9A/exec";
    const athleteSelect = document.getElementById("athlete");
    const weightInput = document.getElementById("weight");
    const submitBtn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = "status show " + type;
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.className = "status";
    }

    function jsonpRequest(params) {
      return new Promise((resolve, reject) => {
        const callbackName =
          "weightTrackerCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

        const script = document.createElement("script");
        const query = new URLSearchParams({
          ...params,
          callback: callbackName
        });

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Request timed out."));
        }, 12000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Could not reach the weigh-in database."));
        };

        script.src = API_URL + "?" + query.toString();
        document.body.appendChild(script);
      });
    }

    async function loadRoster() {
      athleteSelect.disabled = true;
      submitBtn.disabled = true;

      try {
        const data = await jsonpRequest({ action: "roster" });

        if (!data.success || !Array.isArray(data.athletes)) {
          throw new Error(data.error || "Roster could not be loaded.");
        }

        athleteSelect.innerHTML = '<option value="">Select your name</option>';

        data.athletes.forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          athleteSelect.appendChild(option);
        });

        athleteSelect.disabled = false;
        submitBtn.disabled = false;

      } catch (error) {
        athleteSelect.innerHTML = '<option value="">Roster unavailable</option>';
        showStatus("Unable to load the roster. Please tell staff.", "error");
        console.error(error);
      }
    }

    async function submitWeight() {
      const athlete = document.getElementById("athlete").value;
      const weight = document.getElementById("weight").value;
      const status = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");

      if (!athlete) {
        showStatus("Please select your name.", "error");
        return;
      }

      if (!weight) {
        showStatus("Please enter your weight.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      showStatus("", "");

      try {
        const result = await jsonpRequest(
          `${SCRIPT_URL}?action=submit&athlete=${encodeURIComponent(athlete)}&weight=${encodeURIComponent(weight)}`
        );

        if (result.success) {
          showStatus(
            `✓ ${Number(result.weight).toFixed(1)} lb recorded for ${result.athlete}`,
            "success"
          );
          document.getElementById("athlete").value = "";
          document.getElementById("weight").value = "";
          return;
        }

        if (result.duplicate) {
          const existing = Number(result.existingWeight).toFixed(1);
          const proposed = Number(weight).toFixed(1);

          const shouldReplace = window.confirm(
            `${result.athlete} already submitted ${existing} lb today.

` +
            `Replace it with ${proposed} lb?`
          );

          if (!shouldReplace) {
            showStatus(
              `Existing weight kept: ${existing} lb.`,
              "error"
            );
            return;
          }

          submitBtn.textContent = "Updating...";

          const replacement = await jsonpRequest(
            `${SCRIPT_URL}?action=submit&athlete=${encodeURIComponent(athlete)}&weight=${encodeURIComponent(weight)}&replace=true`
          );

          if (replacement.success) {
            showStatus(
              `✓ Weight corrected to ${Number(replacement.weight).toFixed(1)} lb for ${replacement.athlete}`,
              "success"
            );
            document.getElementById("athlete").value = "";
            document.getElementById("weight").value = "";
          } else {
            showStatus(
              replacement.error || "Unable to update weight.",
              "error"
            );
          }

          return;
        }

        showStatus(result.error || "Unable to submit weight.", "error");

      } catch (error) {
        showStatus(
          "Unable to connect to the weigh-in database. Please try again.",
          "error"
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Weight";
      }
    }

      if (!weight || weight < 100 || weight > 400) {
        showStatus("Please enter a valid weight.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      try {
        const result = await jsonpRequest({
          action: "submit",
          athlete: athlete,
          weight: weight.toFixed(1)
        });

        if (!result.success) {
          throw new Error(result.error || "Weight could not be saved.");
        }

        showStatus(
          `✓ ${Number(result.weight).toFixed(1)} lb recorded for ${result.athlete}`,
          "success"
        );

        athleteSelect.value = "";
        weightInput.value = "";
        athleteSelect.focus();

      } catch (error) {
        showStatus(error.message || "Weight was not saved. Please try again.", "error");
        console.error(error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Weight";
      }
    }

    weightInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        submitWeight();
      }
    });

    loadRoster();
  </script>
</body>
</html>
